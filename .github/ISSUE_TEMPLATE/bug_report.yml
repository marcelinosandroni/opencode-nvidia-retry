name: Relato de bug
description: Reporta um problema reproduzível
body:
  - type: textarea
    id: description
    attributes:
      label: Descrição
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passos para reproduzir
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versões do OpenCode e do plugin
    validations:
      required: true
  - type: textarea
    id: configuration
    attributes:
      label: Configuração relevante
      description: Remova segredos.
    validations:
      required: true
